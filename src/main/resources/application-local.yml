spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - com.embabel.agent.autoconfigure.models.openai.custom.AgentOpenAiCustomAutoConfiguration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      indent_output: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        debug: true

embabel:
  models:
    default-llm: llama3.2
  agent:
    platform:
      models:
        ollama:
          base-url: ${OLLAMA_BASE_URL}
      http-client:
        connect-timeout: 10m

server:
  port: ${PORT:8080}

cors:
  allowed-origins: "http://localhost:3000"
  allowed-methods: "GET,POST,PUT,DELETE"
  allowed-headers: "*"

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.nimbusds: DEBUG
    com.rbouaro: DEBUG

extension:
  youtube:
    api-key: ${YOUTUBE_API_KEY}
    base-url: ${YOUTUBE_API_BASE_URL}

jwt:
  jwt-secret: ${JWT_SECRET}
  jwt-expiration: ${JWT_EXPIRATION:60} # 60 minutes
  rsa:
    private-key: |
      ${PRIVATE_KEY}
    public-key: |
      ${PUBLIC_KEY}

springdoc:
  swagger-ui:
    enabled: true

openapi:
  url: ${OPENAPI_SERVER_URL}

app:
  admin:
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  dev:
    username: ${DEV_USERNAME}
    email: ${DEV_EMAIL}
    password: ${DEV_PASSWORD}
  email:
    from: ${MAIL_FROM:no-reply@ai-mentor.com}
    retry:
      initial-delay: 2000
      max-attempts: 3