spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - com.embabel.agent.autoconfigure.models.ollama.AgentOllamaAutoConfiguration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  jackson:
    serialization:
      indent_output: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

embabel:
  models:
    default-llm: ${GROQ_MODEL:llama-3.3-70b-versatile}
  agent:
    platform:
      models:
        openai:
          custom:
            base-url: https://api.groq.com/openai
            api-key: ${GROQ_API_KEY}
            models: ${GROQ_MODEL:llama-3.3-70b-versatile}
      http-client:
        connect-timeout: 10m

server:
  port: ${PORT}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: "GET,POST,PUT,DELETE"
  allowed-headers: "*"

logging:
  level:
    root: WARN
    com.rbouaro: INFO

extension:
  youtube:
    api-key: ${YOUTUBE_API_KEY}
    base-url: ${YOUTUBE_API_BASE_URL}

jwt:
  jwt-secret: ${JWT_SECRET}
  jwt-expiration: ${JWT_EXPIRATION:60}
  rsa:
    private-key: |
      ${PRIVATE_KEY}
    public-key: |
      ${PUBLIC_KEY}

springdoc:
  swagger-ui:
    enabled: false

openapi:
  url: ${OPENAPI_SERVER_URL}

app:
  admin:
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  dev:
    username: ${DEV_USERNAME}
    email: ${DEV_EMAIL}
    password: ${DEV_PASSWORD}
  email:
    from: ${MAIL_FROM}
    retry:
      initial-delay: 2000
      max-attempts: 3
